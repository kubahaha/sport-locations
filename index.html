<!DOCTYPE html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mapa stadionów lig sportowych</title>
    <meta
      name="description"
      content="Mapa stadionów klubów rywalizujących w wybranych ligach sportowych."
    />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/semantic-ui@2.5.0/dist/semantic.min.css"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <button
      class="menu-toggle"
      id="menu-toggle"
      type="button"
      aria-label="Otwórz menu"
      aria-expanded="true"
    >
      ☰
    </button>

    <div class="app-shell">
      <aside class="sidebar" id="sidebar" aria-label="Panel lig">
        <div class="sidebar-header">
          <div>
            <p class="eyebrow">Stadiony</p>
            <h1>Lig sportowych</h1>
          </div>
          <button
            class="settings-toggle"
            id="settings-toggle"
            type="button"
            aria-label="Otwórz ustawienia"
            aria-expanded="false"
            title="Ustawienia"
          >
            <span aria-hidden="true">⚙</span>
          </button>
        </div>

        <section class="settings-panel" id="settings-panel" aria-label="Ustawienia">
          <h2>Ustawienia</h2>
          <label class="setting-option" for="auto-zoom-toggle">
            <input id="auto-zoom-toggle" type="checkbox" />
            <span>Automatycznie przybliżaj mapę</span>
          </label>
          <label class="setting-option" for="full-search-toggle">
            <input id="full-search-toggle" type="checkbox" />
            <span>Używaj pełnej wyszukiwarki</span>
          </label>
          <button id="clear-cache-button" class="clear-cache-button" type="button">
            Wyczyść cache
          </button>
        </section>

        <div class="custom-league">
          <label for="custom-league-input">Wprowadź własną ligę</label>
          <div class="custom-league-row">
            <input
              id="custom-league-input"
              type="text"
              placeholder="np. Ekstraklasa 2025/26, Q139892146"
              aria-label="Wprowadź własną ligę"
            />
            <button id="custom-league-button" type="button">Szukaj</button>
          </div>
          <div id="search-results" class="search-results" aria-live="polite"></div>
        </div>

        <nav class="league-nav" aria-label="Lista lig">
          <ul class="league-list" id="league-list"></ul>
        </nav>
      </aside>

      <main class="map-panel">
        <div class="status-bar">
          <div id="status-message" class="status-message" role="status" aria-live="polite"></div>
        </div>
        <div class="map-toolbar">
          <button id="download-osm-button" class="download-osm-button" type="button">
            Pobierz
          </button>
          <button id="overpass-query-button" class="download-osm-button" type="button">
            Overpass
          </button>
        </div>
        <div id="map" class="map" aria-label="Mapa z lokalizacjami stadionów"></div>
      </main>
    </div>

    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>
    <script type="module" src="./js/app.js"></script>
  </body>
</html>
